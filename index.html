<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Seesaw Simulation</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="app">
            <h1>Seesaw Simulation</h1>
            <h3>Alperen Yılmaz</h3>
            <!-- seesaw plank divi -->
            <div id="scene" class="scene">
                <!-- reset butonu -->
             <div class="reset">
                <button id="resetButton" class="resetButton" type="button">
                    Reset
                </button>
             </div>
                <div id="seesaw" class="seesaw" aria-label="Seesaw">
                    <div id="plank" class="plank"></div>
                    <div class="pivot" aria-hidden="true"></div>
                    <div class="scale" aria-hidden="true">
                        <div class="scaleLabels">
                            <span>-200</span><span>-150</span><span>-100</span><span>-50</span><span>0</span><span>50</span><span>100</span><span>150</span><span>200</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- stat verileri divi -->
            <div class="statsRow" aria-label="Seesaw Stats">
                <div class="statBox">
                    <div class="statLabel">Left Weight</div>
                    <div id="statLeft" class="statValue">0</div>
                </div>
                <div class="statBox">
                    <div class="statLabel">Angle</div>
                    <div id="statAngle" class="statValue">0°</div>
                </div>
                <div class="statBox">
                    <div class="statLabel">Right Weight</div>
                    <div id="statRight" class="statValue">0</div>
                </div>
            </div>

            <!-- log divi -->
            <section class="logPanel" aria-label="Log Kayıtları">
                <div class="logPanelHeader">
                    <h2 class="logPanelTitle">Logs</h2>
                    <button id="clearLogs" class="logClear" type="button">Clear</button>
                </div>
                <div id="log" class="logScroll" role="log" aria-live="polite">
                    <ol id="logList" class="logList"></ol>
                </div>
            </section>
        </main>

        <script src="app.js"></script>
    </body>
</html>
